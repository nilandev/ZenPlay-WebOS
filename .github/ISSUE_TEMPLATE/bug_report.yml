name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! **Please don't include real provider URLs, usernames, passwords or playlists.**
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Live TV
        2. Press down twice
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - LG TV (real device)
        - webOS TV Simulator
        - Browser (pnpm dev)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV model and webOS version
      placeholder: e.g. LG OLED55C1, webOS 6.0
  - type: dropdown
    id: source
    attributes:
      label: Source type
      options:
        - Xtream Codes
        - M3U playlist
        - Not relevant
  - type: input
    id: version
    attributes:
      label: ZenPlay version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Console output from `pnpm inspect-device` or the browser, and screenshots if helpful.
