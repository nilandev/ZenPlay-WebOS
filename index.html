<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenPlay</title>
    <style>
      :root {
        --bg: #08090b;
        --surface: #1a1a20;
        --surface-raised: #24242c;
        --shimmer-highlight: #4a4a58;
        --border: #313139;
        --text: #f4f4f6;
        --text-dim: #9a9aa4;
        --accent: #38bdf8;
        --accent-dim: #1f7fae;
        --danger: #ff6b6b;
        --radius: 10px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        /*
         * Root font-size drives every `rem` value in the app, so this is
         * what actually makes `rem`-based layouts scale proportionally
         * across display sizes (720p/1080p/4K) rather than every card/gap/
         * icon/text staying pinned at a fixed px size regardless of
         * viewport width. 1rem = 16px at a 1920px-wide viewport, 1rem =
         * 32px at 3840px/4K, and so on — the min/max bounds only guard
         * truly pathological window sizes (a sliver-thin browser window,
         * or a multi-monitor-spanning one), not real TV resolutions.
         * `vw`-based clamp() is inherently responsive to viewport resize
         * with no JS needed. (Previously this was set on a div nested
         * inside HomeScreen instead of here, which had no effect at all —
         * CSS `rem` resolves against the document root's font-size, not
         * the nearest styled ancestor's; only `em` does that.)
         */
        font-size: clamp(12px, 0.833vw, 40px);
      }

      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }

      body {
        overflow-x: hidden;
      }

      h1, h2, h3 {
        margin: 0;
        letter-spacing: -0.01em;
      }

      p {
        color: var(--text-dim);
        line-height: 1.5;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      input, select {
        font: inherit;
        color: var(--text);
        background: var(--surface);
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        outline: none;
        transition: border-color 120ms ease-out, box-shadow 120ms ease-out;
      }

      input::placeholder {
        color: var(--text-dim);
      }

      input:focus, select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }

      ::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
